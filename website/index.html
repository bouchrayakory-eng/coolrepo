<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouchraya Yakory - Cloud Engineer Portfolio</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            padding: 2.5rem;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        h1 {
            margin: 0 0 0.5rem 0;
            color: var(--accent);
            font-size: 2rem;
        }
        p {
            line-height: 1.6;
            color: var(--text-muted);
        }
        .status {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.25rem 0.75rem;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bouchraya Yakory</h1>
        <p>Welcome to my Cloud Engineering Portfolio.</p>
        <p>This static site is deployed on AWS via Amazon S3 and CloudFront, managed through Infrastructure as Code (Terraform), and automated using GitHub Actions (CI/CD) with OIDC authentication.</p>
        <span class="status">● Automated CI/CD Active</span>
    </div>
</body>
</html>
