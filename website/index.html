<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
</head>
<body>
  <h1>Welcome to My Portfolio</h1>
  <p>Live visitors: <span id="visitor-count">Loading...</span></p>

  <script>
    const apiEndpoint = "https://j8wv5w9i01.execute-api.us-east-1.amazonaws.com/visitors";

    fetch(apiEndpoint)
      .then(res => res.json())
      .then(data => {
        document.getElementById('visitor-count').innerText = data.views;
      })
      .catch(err => console.error("Error fetching views:", err));
  </script>
</body>
</html>
